services:
  - type: web
    name: j-t-avaria-extravio-pnr
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JT_API_URL
        value: https://jt-api.rockettechbr.com.br
      - key: JT_API_CACHE_SECONDS
        value: "60"
      - key: JT_API_KEY
        sync: false
